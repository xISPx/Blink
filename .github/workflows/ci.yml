name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Compile for Arduino Uno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - Blink
